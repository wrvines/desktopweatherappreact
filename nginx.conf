# If you serve this app on a subdomain (e.g. weather.williamvines.com),
# change all server_name entries, the cert paths, and the redirect below.

# HTTP: redirect to HTTPS, serve ACME challenges for certbot
server {
    listen 80;
    server_name williamvines.com www.williamvines.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://williamvines.com$request_uri;
    }
}

# HTTPS: www -> non-www
server {
    listen 443 ssl;
    server_name www.williamvines.com;

    ssl_certificate /etc/letsencrypt/live/williamvines.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/williamvines.com/privkey.pem;

    return 301 https://williamvines.com$request_uri;
}

# HTTPS: main site
server {
    listen 443 ssl;
    server_name williamvines.com;

    ssl_certificate /etc/letsencrypt/live/williamvines.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/williamvines.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
  web:
    build:
      context: .
      args:
        # Injected into the build so the app works in production.
        # Comes from the .env file next to this compose file (see .env.example).
        VITE_WEATHER_BASE_URL: ${VITE_WEATHER_BASE_URL}
        VITE_GEOCODE_BASE_URL: ${VITE_GEOCODE_BASE_URL}
        VITE_WEATHER_API_KEY: ${VITE_WEATHER_API_KEY}
        VITE_GEOCODE_API_KEY: ${VITE_GEOCODE_API_KEY}
    container_name: weather-app
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy

# Shared network with Nginx Proxy Manager. Create it once with:
#   docker network create proxy
# and attach your NPM container to it.
networks:
  proxy:
    external: true
